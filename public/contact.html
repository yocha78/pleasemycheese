<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Contact — Please My Cheese</title>
    <meta name="description" content="Get in touch about Please My Cheese — cheese or wine suggestions, corrections, or any other question." />
    <meta name="theme-color" content="#160D11" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://pleasemycheese.com/contact.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --lees: #160d11;
        --slab: #20141a;
        --line: #3b2530;
        --chalk: #f2ede4;
        --dim: #a38e97;
        --mute: #7a626c;
        --gold: #c9a227;
        --serif: "Instrument Serif", ui-serif, Georgia, serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: var(--lees);
      }

      body {
        color: var(--chalk);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
      }

      a:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }

      .page {
        max-width: 540px;
        margin: 0 auto;
        padding: 26px 20px 60px;
        min-height: 100vh;
      }

      .back {
        display: inline-block;
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--mute);
        text-decoration: none;
      }

      .back:hover {
        color: var(--gold);
      }

      .mark {
        font-family: var(--serif);
        font-size: 34px;
        line-height: 0.95;
        letter-spacing: -0.015em;
        font-weight: 400;
        margin: 22px 0 0;
      }

      .mark span {
        font-style: italic;
        color: var(--gold);
      }

      h1 {
        font-family: var(--serif);
        font-size: 26px;
        font-weight: 400;
        margin: 30px 0 0;
      }

      .lede {
        font-size: 15.5px;
        line-height: 1.6;
        color: var(--dim);
        margin: 14px 0 0;
      }

      .card {
        margin-top: 30px;
        border-top: 1px solid var(--line);
        padding-top: 24px;
      }

      .email {
        display: inline-block;
        font-family: var(--mono);
        font-size: 15px;
        color: var(--gold);
        text-decoration: none;
        border-bottom: 1px solid var(--gold);
        padding-bottom: 1px;
      }

      .email:hover {
        opacity: 0.8;
      }

      .foot {
        margin-top: 60px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }

      .foot p {
        font-family: var(--mono);
        font-size: 9.5px;
        line-height: 1.7;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--mute);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <a class="back" href="/">← Please My Cheese</a>
      <h1 class="mark">
        Get in <span>touch</span>
      </h1>
      <p class="lede">
        Have a cheese or wine suggestion for the book? Spotted a pairing that's off? Any other question —
        get in touch.
      </p>
      <div class="card">
        <a class="email" href="mailto:pleasemycheese.contact@gmail.com">pleasemycheese.contact@gmail.com</a>
      </div>
      <footer class="foot">
        <p>Please My Cheese. Name the cheese. Get the bottle.</p>
      </footer>
    </div>
  </body>
</html>
